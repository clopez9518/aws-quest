name: Deploy Backend to EC2 via AWS SSM

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'content/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: # Permite disparar el despliegue manualmente desde la interfaz de GitHub

# Permisos mínimos requeridos para OIDC
permissions:
  id-token: write   # Necesario para solicitar el JWT OIDC a GitHub
  contents: read    # Necesario para leer el código del repositorio

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore apps/api/src/AwsQuest.Api/AwsQuest.Api.csproj

      - name: Run Unit Tests
        run: dotnet test apps/api/tests/AwsQuest.UnitTests/AwsQuest.UnitTests.csproj --no-restore --verbosity normal

  deploy:
    name: Deploy to AWS EC2
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Autenticación OIDC con AWS (Sin Access Keys estáticas)
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Execute Deployment via AWS SSM Run Command
        id: ssm
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          echo "Enviando comando de despliegue a la instancia $INSTANCE_ID..."
          
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions deploy commit ${{ github.sha }}" \
            --parameters '{"commands":["runuser -l ubuntu -c /home/ubuntu/deploy-api.sh"]}' \
            --output text \
            --query "Command.CommandId")
          
          echo "Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT

      - name: Poll SSM Command Execution and Stream Logs
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          echo "Esperando a que finalice la ejecución del comando $COMMAND_ID..."
          
          # Esperar hasta que el comando termine en SSM
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          # Obtener los logs detallados y el estado final
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)
            
          echo "Estado final: $STATUS"
          echo "=== Salida del Script (STDOUT) ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "=== Errores del Script (STDERR) ==="
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" \
              --output text
            echo "❌ El despliegue falló con estado $STATUS"
            exit 1
          fi

          echo "🚀 Despliegue completado con éxito en EC2."