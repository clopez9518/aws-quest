name: Deploy Backend to EC2 via AWS SSM & GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'content/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  id-token: write   # Necesario para solicitar el JWT OIDC a GitHub
  contents: read    # Necesario para clonar el repositorio
  packages: write   # Necesario para publicar la imagen en GitHub Container Registry (ghcr.io)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: clopez9518/aws-quest

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore apps/api/src/AwsQuest.Api/AwsQuest.Api.csproj

      - name: Run Unit Tests
        run: dotnet test apps/api/tests/AwsQuest.UnitTests/AwsQuest.UnitTests.csproj --no-restore --verbosity normal

  build-and-push:
    name: Build & Push Docker Image to GHCR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Execute Deployment via AWS SSM Run Command
        id: ssm
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          echo "Enviando comando de despliegue a la instancia $INSTANCE_ID..."
          
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy image commit ${{ github.sha }}" \
            --parameters '{"commands":["runuser -l ubuntu -c /home/ubuntu/deploy-api.sh"]}' \
            --output text \
            --query "Command.CommandId")
          
          echo "Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT

      - name: Poll SSM Command Execution and Stream Logs
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          echo "Monitoreando comando $COMMAND_ID en la instancia $INSTANCE_ID..."
          
          # Bucle de sondeo seguro (máximo 5 minutos: 30 ciclos de 10 segundos)
          MAX_ATTEMPTS=30
          ATTEMPT=0
          STATUS="InProgress"

          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              break
            fi

            ATTEMPT=$((ATTEMPT + 1))
            echo "Despliegue en curso ($STATUS)... [Intento $ATTEMPT/$MAX_ATTEMPTS]"
            sleep 10
          done

          echo "Estado final de SSM: $STATUS"
          echo "=== STDOUT ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "=== STDERR ==="
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" \
              --output text
            echo "❌ El despliegue falló con estado $STATUS"
            exit 1
          fi

          echo "🚀 Despliegue completado con éxito en EC2."